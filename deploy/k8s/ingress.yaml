apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hazardd
  namespace: gps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: gps.teintinu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hazardd
                port:
                  number: 80
  tls:
    - hosts:
        - gps.teintinu.com
      secretName: gps-teintinu-tls
