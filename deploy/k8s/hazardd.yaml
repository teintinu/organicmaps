apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazardd
  namespace: gps
  labels:
    app: hazardd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hazardd
  template:
    metadata:
      labels:
        app: hazardd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: hazardd
          image: ghcr.io/teintinu/hazardd:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hazardd-env
                  key: DATABASE_URL
            - name: TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: hazardd-env
                  key: TOKEN_PEPPER
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hazardd
  namespace: gps
spec:
  selector:
    app: hazardd
  ports:
    - name: http
      port: 80
      targetPort: 8080
