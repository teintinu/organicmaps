# Reference deployment: Postgres + hazardd behind your TLS reverse proxy.
#
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) TOKEN_PEPPER=$(openssl rand -hex 32) \
#     docker compose up -d --build
#
# Then point Caddy/nginx at 127.0.0.1:8080.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hazard
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - hazardd-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazard -d hazard"]
      interval: 5s
      timeout: 3s
      retries: 10

  hazardd:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://hazard:${POSTGRES_PASSWORD}@db:5432/hazard
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER to a long random string}
      PORT: "8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/hazardd", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  hazardd-db:
