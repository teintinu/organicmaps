[package]
name = "hazardd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-hostable road hazard service for Organic Maps (API v1)"

[dependencies]
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
