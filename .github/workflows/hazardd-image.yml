name: hazardd image

on:
  push:
    branches: [deploy/hazardd]
    paths:
      - "server/hazardd/**"
      - ".github/workflows/hazardd-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server/hazardd
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/teintinu/hazardd:v1
            ghcr.io/teintinu/hazardd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
